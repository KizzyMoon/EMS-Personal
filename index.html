<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=ems-dashboard.html" />
    <title>EMS Dashboard</title>
    <link rel="icon" type="image/png" href="ems-favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: #070b10;
        color: #f5f7fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 28% 18%, rgba(248, 162, 162, 0.12), transparent 34%),
          #070b10;
      }

      main {
        width: min(420px, calc(100% - 32px));
        border: 1px solid rgba(248, 162, 162, 0.22);
        border-radius: 14px;
        background: rgba(12, 17, 24, 0.9);
        padding: 28px;
        text-align: center;
      }

      img {
        width: 54px;
        height: 54px;
        object-fit: contain;
      }

      h1 {
        margin: 14px 0 8px;
        font-size: 1.25rem;
      }

      p {
        margin: 0 0 18px;
        color: #9ca8b8;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        border: 1px solid rgba(248, 162, 162, 0.36);
        border-radius: 8px;
        background: rgba(248, 162, 162, 0.1);
        color: #fff;
        font-weight: 900;
        padding: 0 14px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="ems-favicon.png" alt="" />
      <h1>EMS Dashboard</h1>
      <p>Redirecting to the Highlife RP EMS Dashboard.</p>
      <a href="ems-dashboard.html">Open EMS Dashboard</a>
    </main>
  </body>
</html>
